servers:
  - url: http://localhost:4101
    description: Local development server (each app deploys its own Homileo; substitute its host)

security:
  - BearerAuth: []

tags:
  - name: Spaces
    description: Places that group sessions, with members, a kind and an access policy

  - name: Platform
    description: Health and the caller's own identity

  - name: Principals
    description: Users, bots and external identities that take part in chat

  - name: Sessions
    description: Conversations, in a space or on their own, and direct messages

  - name: Messages
    description: Messages, thread replies and mentions

  - name: Events
    description: Catching up on the events the socket delivers

x-tagGroups:
  - name: Spaces
    tags: [Spaces]
  - name: Sessions
    tags: [Sessions]
  - name: Messages
    tags: [Messages]
  - name: Events
    tags: [Events]
  - name: Principals
    tags: [Principals]
  - name: Platform
    tags: [Platform]

