servers:
  - url: http://localhost:4101
    description: Local development server (each app deploys its own Homileo; substitute its host)

security:
  - BearerAuth: []

tags:
  - name: Platform
    description: Health and the caller's own identity

x-tagGroups:
  - name: Platform
    tags: [Platform]

paths:
  /health:
    $ref: './paths/platform/health.yaml#/~1health'
  /v1/me:
    $ref: './paths/platform/me.yaml#/~1v1~1me'

components:
  securitySchemes:
    BearerAuth:
      $ref: './components/security.yaml#/BearerAuth'
  parameters:
    CursorParam:
      $ref: './components/parameters.yaml#/CursorParam'
    LimitParam:
      $ref: './components/parameters.yaml#/LimitParam'
  responses:
    BadRequestResponse:
      $ref: './components/responses.yaml#/BadRequestResponse'
    UnauthorizedResponse:
      $ref: './components/responses.yaml#/UnauthorizedResponse'
    ForbiddenResponse:
      $ref: './components/responses.yaml#/ForbiddenResponse'
    NotFoundResponse:
      $ref: './components/responses.yaml#/NotFoundResponse'
    ConflictResponse:
      $ref: './components/responses.yaml#/ConflictResponse'
    ServerErrorResponse:
      $ref: './components/responses.yaml#/ServerErrorResponse'
    NoContentResponse:
      $ref: './components/responses.yaml#/NoContentResponse'
  schemas:
    Error:
      $ref: './components/responses.yaml#/Error'
    HealthStatus:
      $ref: './components/platform/schemas.yaml#/HealthStatus'
    MeResponse:
      $ref: './components/platform/schemas.yaml#/MeResponse'
    WebhookEvent:
      $ref: './components/webhook-schemas.yaml#/WebhookEvent'

# Each event type's webhook is added by the task that emits it.
webhooks: {}
