# Shared by every area. Variants that differ per area carry its prefix
# (SpacesConflictResponse, …) and live in <area>/responses.yaml.

Error:
  type: object
  description: Every error body
  required: [error, error_description]
  properties:
    error:
      type: string
      description: A stable, machine-readable code
    error_description:
      type: string
      description: A human-readable explanation
    issues:
      type: array
      description: On `invalid_request`, the failed checks
      items:
        type: object
        required: [path, message]
        properties:
          path:
            type: string
            description: The field, dotted (`metadata.key`); empty for the whole value
          message:
            type: string

BadRequestResponse:
  description: Bad request - `invalid_request` (with `issues`), `organization_required` when the token has no organization, or an operation's own 400 code
  content:
    application/json:
      schema:
        $ref: '#/Error'

UnauthorizedResponse:
  description: Unauthorized - the access token is missing, invalid or expired
  content:
    application/json:
      schema:
        $ref: '#/Error'

ForbiddenResponse:
  description: Forbidden - the caller can read the resource but may not do this (or lacks the permission the route needs)
  content:
    application/json:
      schema:
        $ref: '#/Error'

NotFoundResponse:
  description: Not found - the resource does not exist, is in another organization, or the caller cannot read it (the three look alike)
  content:
    application/json:
      schema:
        $ref: '#/Error'

ConflictResponse:
  description: Conflict - the request clashes with the resource's state, e.g. `conflict`, `resource_archived`, `already_archived`, `last_owner`, `already_member`, `external_ref_taken`, `managed_by_provisioning`, `reaction_limit`, or `version_conflict` (a concurrent write or deadlock; re-read and retry)
  content:
    application/json:
      schema:
        $ref: '#/Error'

PayloadTooLargeResponse:
  description: Payload too large - `payload_too_large`, the body is over the route's size limit
  content:
    application/json:
      schema:
        $ref: '#/Error'

ServerErrorResponse:
  description: Server error - `server_error`
  content:
    application/json:
      schema:
        $ref: '#/Error'

ServiceUnavailableResponse:
  description: |
    Service unavailable - `temporarily_unavailable`: tereo's file storage did not answer, or the
    database was too busy (a transaction or a lock wait ran out of time, or no connection was free).
    Nothing was changed; retry, after `Retry-After` when it is given.
  headers:
    Retry-After:
      description: Seconds to wait before retrying; sent when the database was too busy
      schema:
        type: integer
  content:
    application/json:
      schema:
        $ref: '#/Error'

NoContentResponse:
  description: Done; no content
