SearchSnippet:
  type: object
  description: |
    The matched excerpt of a message as plain text, never HTML. `highlights` are `[start, end]`
    offsets into `text` in UTF-16 code units (JavaScript string indices), end exclusive. A hit
    found only by an attachment filename has an empty snippet.
  required: [text, highlights]
  properties:
    text: { type: string }
    highlights:
      type: array
      items:
        type: array
        prefixItems:
          - { type: integer, minimum: 0 }
          - { type: integer, minimum: 0 }
        minItems: 2
        maxItems: 2

MessageSearchHit:
  type: object
  required: [message, session, snippet]
  properties:
    message: { $ref: '../messages/schemas.yaml#/Message' }
    session: { $ref: '../sessions/schemas.yaml#/Session' }
    snippet: { $ref: '#/SearchSnippet' }

SearchMessagesResponse:
  type: object
  required: [data, nextCursor]
  properties:
    data:
      type: array
      items: { $ref: '#/MessageSearchHit' }
    nextCursor:
      type: [string, 'null']
      description: Null on the last page, and at the depth limit

SessionSearchHit:
  description: A space or a session, in one ranked list
  oneOf:
    - type: object
      required: [type, space]
      properties:
        type: { type: string, const: space }
        space: { $ref: '../spaces/schemas.yaml#/Space' }
    - type: object
      required: [type, session]
      properties:
        type: { type: string, const: session }
        session: { $ref: '../sessions/schemas.yaml#/Session' }
  discriminator:
    propertyName: type

SearchSessionsResponse:
  type: object
  required: [data, nextCursor]
  properties:
    data:
      type: array
      items: { $ref: '#/SessionSearchHit' }
    nextCursor:
      type: [string, 'null']
      description: Null on the last page, and at the depth limit

SearchPrincipalsResponse:
  type: object
  required: [data]
  properties:
    data:
      type: array
      items: { $ref: '../principals/schemas.yaml#/Principal' }
