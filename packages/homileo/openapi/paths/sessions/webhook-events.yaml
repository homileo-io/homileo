homileo.session.created:
  post:
    tags: [Sessions]
    summary: Session created
    description: For a session with `access` `space`; a private session (space-less, or `access` `members`) sends `homileo.private_session.created` instead.
    operationId: webhookSessionCreated
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/webhook-schemas.yaml#/WebhookEvent'
              - type: object
                properties:
                  eventType: { const: homileo.session.created }
                  entityType: { const: session }
                  data: { $ref: '../../components/sessions/schemas.yaml#/SessionEventData' }
    responses:
      '2XX':
        description: Any 2xx response acknowledges the delivery; anything else is retried.
