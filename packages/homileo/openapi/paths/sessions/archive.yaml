/v1/sessions/{sessionId}/archive:
  post:
    tags: [Sessions]
    summary: Archive a session
    description: |
      Archives the session. In a space it needs the right to moderate the space; in a group without
      a space, the participant `owner` or `homileo.chat.admin`; a DM, only `homileo.chat.admin`.
      An admin of the session's organization, and in a space whoever can moderate it, reach it
      without being a participant or able to read it (a space-less session, an `access: members`
      session): such a caller gets `204` with no body instead of the session's view. Archiving an archived session is `409 already_archived`. Records
      `session.archived`.

      **Required permissions:** `homileo.spaces.write` or `homileo.chat.admin` (`403 forbidden` without).
    operationId: archiveSession
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200':
        description: The archived session
        content:
          application/json:
            schema:
              $ref: '../../components/sessions/schemas.yaml#/SessionResponse'
      '204':
        description: Archived by an admin or space moderator who cannot read the session
      '400': { $ref: '../../components/responses.yaml#/BadRequestResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/ForbiddenResponse' }
      '404': { $ref: '../../components/responses.yaml#/NotFoundResponse' }
      '409': { $ref: '../../components/responses.yaml#/ConflictResponse' }
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
      '503': { $ref: '../../components/responses.yaml#/ServiceUnavailableResponse' }
