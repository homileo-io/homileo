/v1/sessions/{sessionId}/notify:
  put:
    tags: [Sessions]
    summary: Set the caller's notify level
    description: |
      Sets how the caller is notified of this session. A personal setting: records no event. A
      caller who can read the session but is not a participant gets `403 not_a_participant`.

      **Required permissions:** none; any signed-in caller in an organization.
    operationId: putSessionNotify
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/sessions/schemas.yaml#/NotifyRequest'
    responses:
      '200':
        description: The caller's participation
        content:
          application/json:
            schema:
              $ref: '../../components/sessions/schemas.yaml#/ParticipantResponse'
      '400': { $ref: '../../components/responses.yaml#/BadRequestResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/ForbiddenResponse' }
      '404': { $ref: '../../components/responses.yaml#/NotFoundResponse' }
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
