/v1/sessions/{sessionId}:
  get:
    tags: [Sessions]
    summary: Get a session
    description: |
      The session and the caller's own participation (`null` when they can read it without being a
      participant). A session the caller cannot read is `404`, and so is one in another
      organization.

      **Required permissions:** none; any signed-in caller in an organization.
    operationId: getSession
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200':
        description: The session
        content:
          application/json:
            schema:
              $ref: '../../components/sessions/schemas.yaml#/GetSessionResponse'
      '400': { $ref: '../../components/responses.yaml#/BadRequestResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '404': { $ref: '../../components/responses.yaml#/NotFoundResponse' }
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
  patch:
    tags: [Sessions]
    summary: Update a session
    description: |
      Changes `name`, `state`, `externalRef` or `metadata` (replaced whole). In a space it needs
      the right to moderate the space; in a group without a space, the participant `owner`. A DM has
      nothing to edit (`403`). An archived session answers `409 resource_archived`. A body that
      changes nothing records no event. Records `session.updated`.

      **Required permissions:** none; any signed-in caller in an organization.
    operationId: updateSession
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/sessions/schemas.yaml#/UpdateSessionRequest'
    responses:
      '200':
        description: The updated session
        content:
          application/json:
            schema:
              $ref: '../../components/sessions/schemas.yaml#/SessionResponse'
      '400': { $ref: '../../components/responses.yaml#/BadRequestResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/ForbiddenResponse' }
      '404': { $ref: '../../components/responses.yaml#/NotFoundResponse' }
      '409': { $ref: '../../components/responses.yaml#/ConflictResponse' }
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
