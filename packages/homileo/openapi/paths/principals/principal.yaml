/v1/principals/{principalId}:
  get:
    tags: [Principals]
    summary: Get a principal
    description: |
      One principal by id. Principals belong to no organization, so any signed-in caller may read
      any of them.

      **Required permissions:** `homileo.spaces.read`, which `homileo.spaces.write` and `homileo.chat.admin` include (`403 forbidden` without).
    operationId: getPrincipal
    parameters:
      - name: principalId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200':
        description: The principal
        content:
          application/json:
            schema:
              $ref: '../../components/principals/schemas.yaml#/GetPrincipalResponse'
      '400': { $ref: '../../components/responses.yaml#/BadRequestResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/ForbiddenResponse' }
      '404': { $ref: '../../components/responses.yaml#/NotFoundResponse' }
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
      '503': { $ref: '../../components/responses.yaml#/ServiceUnavailableResponse' }
