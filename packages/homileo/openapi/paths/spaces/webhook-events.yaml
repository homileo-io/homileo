homileo.space.created:
  post:
    tags: [Spaces]
    summary: Space created
    operationId: webhookSpaceCreated
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/webhook-schemas.yaml#/WebhookEvent'
              - type: object
                properties:
                  eventType: { const: homileo.space.created }
                  entityType: { const: space }
                  data: { $ref: '../../components/spaces/schemas.yaml#/SpaceEventData' }
    responses:
      '2XX':
        description: Any 2xx response acknowledges the delivery; anything else is retried.

