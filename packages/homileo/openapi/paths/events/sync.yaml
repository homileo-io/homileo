/v1/sync:
  get:
    tags: [Events]
    summary: Catch up on events
    description: |
      The events the caller would have received on the socket after `since`, with the same ids, in
      commit order. A client calls it on reconnect, with the socket already connected and
      buffering, passing as `until` the position the socket's `ready` event (and its `subscribe`
      acks) gave, until `hasMore` is false, backing off briefly only after a page whose `next` is
      the cursor it sent (an empty page that advanced is normal: go on at once); then it applies the buffered socket events, skipping
      ids it has seen. Without `since` it returns no events and the head as `next`.

      Events are read only from transactions older than every one still running on the database
      server, so an open write transaction anywhere on it holds the catch-up back until it ends;
      with `until`, `hasMore` stays true meanwhile. Socket delivery does not wait.

      An event is returned when the caller can read its session or space **now** and is one of:
      - a current participant of the event's session (session events);
      - a member of the event's space (space events, and `session.created`, `session.updated` and
        `session.archived` of an `access: space` session in it);
      - mentioned in a `message.created`, `message.edited` or `message.deleted`, while still a
        participant of the session, or a member of the space of an `access: space` session;
      - or the session or space is named in `sessionIds` / `spaceIds`.

      `space.join_requested` and `space.join_decided` are returned to a member or `spaceIds`
      subscriber only when they can moderate the space, as with
      `GET /v1/spaces/{spaceId}/join-requests`.

      An event that names the caller is returned whatever the caller can read now: a member,
      join-request or participant event about them, and `read.updated`. An access revocation
      naming them is returned only once they really cannot read the resource.

      Events of other organizations are never returned.

      `message.created`, `message.edited` and `message.deleted` carry the message's **current**
      view, as `GET /v1/messages/{messageId}` returns it when the page is read, not the view stored
      at the event: every event of a deleted message carries its deleted view, and every event of
      an edited one its latest revision. The exception is `reactions` with `reactionSeq`, which keep
      the pair stored with the event (a deleted message's are its view's: none). Every reaction
      event carries the message's whole summary and `reactionSeq` too; a client keeps the summary
      with the highest `reactionSeq`, so it converges whatever order the events arrive in. The cursor is not
      signed; because of this and the rule above, a made-up cursor reveals nothing the REST
      routes do not.

      One page scans at most 5000 rows of the caller's organization's log, matching or not; a
      page cut there answers `hasMore: true` with a `next` past the rows it scanned, so a reader
      with few relevant events in a busy log pages through it rather than one request scanning it
      all.

      **Required permissions:** `homileo.spaces.read`, which `homileo.spaces.write` and `homileo.chat.admin` include (`403 forbidden` without).
    operationId: sync
    parameters:
      - $ref: '../../components/events/parameters.yaml#/SyncSinceParam'
      - $ref: '../../components/events/parameters.yaml#/SyncUntilParam'
      - $ref: '../../components/events/parameters.yaml#/SyncLimitParam'
      - $ref: '../../components/events/parameters.yaml#/SyncSessionIdsParam'
      - $ref: '../../components/events/parameters.yaml#/SyncSpaceIdsParam'
    responses:
      '200':
        description: A page of the caller's events and the cursor to continue from
        content:
          application/json:
            schema:
              $ref: '../../components/events/schemas.yaml#/SyncResponse'
      '400': { $ref: '../../components/responses.yaml#/BadRequestResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/ForbiddenResponse' }
      '410': { $ref: '../../components/events/responses.yaml#/SyncResyncRequiredResponse' }
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
      '503': { $ref: '../../components/responses.yaml#/ServiceUnavailableResponse' }
