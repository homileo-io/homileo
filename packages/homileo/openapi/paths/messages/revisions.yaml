/v1/messages/{messageId}/revisions:
  get:
    tags: [Messages]
    summary: List a message's revisions
    description: |
      Every revision of the message, oldest first; revision 1 is the original. Deleted messages
      keep theirs.

      **Required permissions:** none; the caller must be the message's sender or able to
      moderate its space (`403` for any other reader). A caller who cannot read the message gets
      `404`.
    operationId: listMessageRevisions
    parameters:
      - $ref: '../../components/messages/parameters.yaml#/MessageIdParam'
    responses:
      '200':
        description: The revisions
        content:
          application/json:
            schema:
              $ref: '../../components/messages/schemas.yaml#/ListMessageRevisionsResponse'
      '400': { $ref: '../../components/responses.yaml#/BadRequestResponse' }
      '401': { $ref: '../../components/responses.yaml#/UnauthorizedResponse' }
      '403': { $ref: '../../components/responses.yaml#/ForbiddenResponse' }
      '404': { $ref: '../../components/responses.yaml#/NotFoundResponse' }
      '500': { $ref: '../../components/responses.yaml#/ServerErrorResponse' }
