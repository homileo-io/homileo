homileo.message.created:
  post:
    tags: [Messages]
    summary: Message created
    description: A message or a reply was sent. Deliveries come from tereo, signed by tereo; see tereo's webhook documentation for the headers and signature.
    operationId: webhookMessageCreated
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/webhook-schemas.yaml#/WebhookEvent'
              - type: object
                properties:
                  eventType: { const: homileo.message.created }
                  entityType: { const: message }
                  data: { $ref: '../../components/messages/schemas.yaml#/MessageEventData' }
    responses:
      '2XX':
        description: Any 2xx response acknowledges the delivery; anything else is retried.
homileo.thread.updated:
  post:
    tags: [Messages]
    summary: Thread updated
    description: A reply changed a thread root's `replyCount` and `lastReplyAt`. `entityId` is the root's id.
    operationId: webhookThreadUpdated
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
