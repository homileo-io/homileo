homileo.private_message.created:
  post:
    tags: [Messages]
    summary: Message created (private session)
    description: Sent instead of `homileo.message.created` for a private session (space-less, or `access` `members`); only a webhook whose creator holds `homileo.messages.read_private` receives it. A message or a reply was sent. Deliveries come from tereo, signed by tereo; see tereo's webhook documentation for the headers and signature.
    operationId: webhookPrivateMessageCreated
