components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A tereo access token. Homileo verifies it with tereo's SDK and takes the caller's user id,
        permissions and organization (`org_id`) from it. A token without an organization is refused
        with `400 organization_required`.

        The one permission a route asks of the token is `homileo.spaces.write`, on `POST /v1/spaces`.
        Permissions are tereo's dotted, hierarchical form: `write` covers `read`, and a domain's
        `admin` covers all of it. Everything else is decided by the access rules for the resource.
  parameters:
    CursorParam:
      name: cursor
      in: query
      description: |
        Opaque cursor for keyset pagination: the `nextCursor` of the previous page. Omit it on the
        first request. A malformed cursor is `400 invalid_request`.
      required: false
      schema:
        type: string
    LimitParam:
      name: limit
      in: query
      description: Maximum number of items per page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    SpacesMembershipParam:
      name: membership
      in: query
      required: false
      description: |
        `member` (the default) lists the spaces the caller is a member of. `readable` adds the
        `public` spaces, the spaces of kinds whose grant the caller holds, and, for a
        `homileo.chat.admin`, every space of the organization.
      schema:
        type: string
        enum:
          - member
          - readable
        default: member
    SpacesKindParam:
      name: kind
      in: query
      required: false
      description: Only spaces of this kind
      schema:
        type: string
        minLength: 1
        maxLength: 64
    SpacesExternalRefParam:
      name: externalRef
      in: query
      required: false
      description: Only the space with this external reference
      schema:
        type: string
        minLength: 1
        maxLength: 255
    SpacesIncludeArchivedParam:
      name: includeArchived
      in: query
      required: false
      description: Also list archived spaces
      schema:
        type: boolean
        default: false
    SpaceIdParam:
      name: spaceId
      in: path
      required: true
      description: The space's id. A value that is not a UUID is `400 invalid_request`.
      schema:
        type: string
        format: uuid
    MembersRoleParam:
      name: role
      in: query
      required: false
      description: Only members with this role
      schema:
        $ref: '#/components/schemas/SpaceRole'
    PrincipalIdParam:
      name: principalId
      in: path
      required: true
      description: The principal's id (a member's, or the applicant's of a join request). A value that is not a UUID is `400 invalid_request`.
      schema:
        type: string
        format: uuid
    JoinRequestsStatusParam:
      name: status
      in: query
      required: false
      description: Only requests in this state
      schema:
        type: string
        enum:
          - pending
          - approved
          - denied
        default: pending
    MessagesBeforeParam:
      name: before
      in: query
      required: false
      description: The `limit` top-level messages just below this `seq`. At most one of `before`, `after` and `around`.
      schema:
        type: integer
        minimum: 0
    MessagesAfterParam:
      name: after
      in: query
      required: false
      description: The `limit` top-level messages just above this `seq`. At most one of `before`, `after` and `around`.
      schema:
        type: integer
        minimum: 0
    MessagesAroundParam:
      name: around
      in: query
      required: false
      description: |
        Up to `limit / 2` top-level messages on each side of this `seq`, the message at `seq` included
        (with an odd `limit`, the extra one is on the newer side). Opens a search hit in context. At
        most one of `before`, `after` and `around`.
      schema:
        type: integer
        minimum: 0
    MessageIdParam:
      name: messageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReactionEmojiParam:
      name: emoji
      in: path
      required: true
      description: URL-encoded. One emoji sequence (a skin tone or a ZWJ sequence counts as one), or a `:shortcode:` of 1-62 lower-case letters, digits, `_`, `+` or `-`; 64 characters at most.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    ThreadIdParam:
      name: rootId
      in: path
      required: true
      description: The thread's root message, a top-level message
      schema:
        type: string
        format: uuid
    SyncSinceParam:
      name: since
      in: query
      required: false
      description: |
        The `next` of the previous `/v1/sync` response, as it was returned: an opaque cursor. Omit it
        to get the head, the position a reader starting now begins from. A malformed cursor is
        `400 invalid_request`.
      schema:
        type: string
        minLength: 1
    SyncLimitParam:
      name: limit
      in: query
      required: false
      description: |
        How many events of the log to read. Events the caller may not receive are read and left out,
        so a page can hold fewer, even none, while `hasMore` is true.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    SyncSessionIdsParam:
      name: sessionIds
      in: query
      required: false
      description: |
        Up to 50 session ids, comma-separated, whose events to return as if the caller were
        subscribed to them on the socket. Sessions the caller cannot read are ignored.
      schema:
        type: string
        examples:
          - 0194c0de-0000-7000-8000-000000000006,0194c0de-0000-7000-8000-000000000007
    SyncSpaceIdsParam:
      name: spaceIds
      in: query
      required: false
      description: |
        Up to 50 space ids, comma-separated, whose space events (and the lifecycle events of their
        `access: space` sessions) to return as if the caller were subscribed to them. Spaces the
        caller cannot read are ignored.
      schema:
        type: string
        examples:
          - 0194c0de-0000-7000-8000-000000000003
  responses:
    BadRequestResponse:
      description: Bad request - `invalid_request` (with `issues`), `organization_required` when the token has no organization, or an operation's own 400 code
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnauthorizedResponse:
      description: Unauthorized - the access token is missing, invalid or expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForbiddenResponse:
      description: Forbidden - the caller can read the resource but may not do this (or lacks the permission the route needs)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFoundResponse:
      description: Not found - the resource does not exist, is in another organization, or the caller cannot read it (the three look alike)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ConflictResponse:
      description: Conflict - the request clashes with the resource's state, e.g. `resource_archived`, `already_archived`, `last_owner`, `external_ref_taken`, `managed_by_provisioning`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerErrorResponse:
      description: Server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoContentResponse:
      description: Done; no content
    SyncResyncRequiredResponse:
      description: |
        Gone - `resync_required`: the cursor is older than the oldest retained events (plus a 10 minute
        margin). Events may be missing after it; reload the state through the REST API and start again
        from a new head (`GET /v1/sync` without `since`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      description: Every error body
      required:
        - error
        - error_description
      properties:
        error:
          type: string
          description: A stable, machine-readable code
        error_description:
          type: string
          description: A human-readable explanation
        issues:
          type: array
          description: On `invalid_request`, the failed checks
          items:
            type: object
            required:
              - path
              - message
            properties:
              path:
                type: string
                description: The field, dotted (`metadata.key`); empty for the whole value
              message:
                type: string
    HealthStatus:
      type: object
      required:
        - status
        - postgres
        - redis
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        postgres:
          type: string
          enum:
            - ok
            - fail
        redis:
          type: string
          enum:
            - ok
            - fail
    MeResponse:
      type: object
      required:
        - principal
        - organizationId
        - permissions
      properties:
        principal:
          $ref: '#/components/schemas/MePrincipal'
        organizationId:
          type: string
          format: uuid
          description: The organization of the token
        permissions:
          type: array
          description: The token's tereo permissions
          items:
            type: string
    UnreadSession:
      type: object
      required:
        - sessionId
        - unread
        - unreadCapped
        - mentions
        - lastSeq
        - lastReadSeq
      properties:
        sessionId:
          type: string
          format: uuid
        unread:
          type: integer
          minimum: 0
          maximum: 99
          description: Top-level messages above the caller's read position, not their own; at most 99
        unreadCapped:
          type: boolean
          description: There are more than 99 unread messages
        mentions:
          type: integer
          minimum: 0
          maximum: 99
          description: |
            Unread top-level messages and replies that mention the caller, or carry `here` or `session`,
            not the caller's own; at most 99
        lastSeq:
          type: integer
        lastReadSeq:
          type: integer
    UnreadThread:
      type: object
      required:
        - rootId
        - sessionId
        - unread
        - unreadCapped
      properties:
        rootId:
          type: string
          format: uuid
          description: The thread's root message
        sessionId:
          type: string
          format: uuid
        unread:
          type: integer
          minimum: 1
          maximum: 99
          description: Replies above the caller's thread read position, not their own; at most 99
        unreadCapped:
          type: boolean
    UnreadResponse:
      type: object
      description: |
        Only entries with something unread (or, for sessions, a mention), in the caller's organization,
        for sessions they currently participate in and can read.
      required:
        - sessions
        - threads
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/UnreadSession'
        threads:
          type: array
          description: Followed threads only
          items:
            $ref: '#/components/schemas/UnreadThread'
      examples:
        - sessions:
            - sessionId: 0192f3a0-0000-7000-8000-000000000001
              unread: 99
              unreadCapped: true
              mentions: 2
              lastSeq: 240
              lastReadSeq: 100
          threads:
            - rootId: 0192f3a0-0000-7000-8000-000000000002
              sessionId: 0192f3a0-0000-7000-8000-000000000001
              unread: 3
              unreadCapped: false
    MentionItem:
      type: object
      required:
        - message
        - session
      properties:
        message:
          $ref: '#/components/schemas/Message'
        session:
          $ref: '#/components/schemas/Session'
    ListMentionsResponse:
      type: object
      required:
        - data
        - nextCursor
      properties:
        data:
          type: array
          description: Newest first
          items:
            $ref: '#/components/schemas/MentionItem'
        nextCursor:
          type:
            - string
            - 'null'
          description: The cursor of the next page, `null` on the last
    Principal:
      type: object
      description: A user, bot or external identity that sends messages and joins spaces and sessions
      required:
        - id
        - kind
        - tereoUserId
        - isBot
        - displayName
        - avatarUrl
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier
        kind:
          type: string
          enum:
            - user
            - external
        tereoUserId:
          type:
            - string
            - 'null'
          format: uuid
          description: The tereo user the principal is, for a `user`
        isBot:
          type: boolean
          description: True for a tereo service account
        displayName:
          type:
            - string
            - 'null'
          maxLength: 255
        avatarUrl:
          type:
            - string
            - 'null'
    GetPrincipalResponse:
      type: object
      required:
        - principal
      properties:
        principal:
          $ref: '#/components/schemas/Principal'
    ResolvePrincipalsRequest:
      type: object
      additionalProperties: false
      required:
        - tereoUserIds
      properties:
        tereoUserIds:
          type: array
          description: Tereo user ids, without duplicates
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
      examples:
        - tereoUserIds:
            - 0198c3a4-5b6d-7a10-8f2e-3c4d5e6f7a8b
    ResolvePrincipalsResponse:
      type: object
      required:
        - data
        - missing
      properties:
        data:
          type: array
          description: The principals of the users tereo knows, in the order asked
          items:
            $ref: '#/components/schemas/Principal'
        missing:
          type: array
          description: The ids tereo does not know; no principal is created for them
          items:
            type: string
            format: uuid
    SpaceRole:
      type: string
      enum:
        - owner
        - moderator
        - member
    Space:
      type: object
      description: A place that groups sessions and has members, in one organization
      required:
        - id
        - organizationId
        - kind
        - name
        - description
        - visibility
        - joinPolicy
        - postPolicy
        - state
        - externalRef
        - metadata
        - createdBy
        - createdAt
        - updatedAt
        - archivedAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier
        organizationId:
          type: string
          format: uuid
          description: The tereo organization it belongs to
        kind:
          type: string
          description: The space kind, `default` or a provisioned one (`<app>:<name>`)
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type:
            - string
            - 'null'
        visibility:
          type: string
          enum:
            - public
            - members
          description: '`public` spaces can be read by anyone in the organization; `members` only by members, kind grants and admins'
        joinPolicy:
          type: string
          enum:
            - open
            - request
            - invite
        postPolicy:
          type: string
          enum:
            - members
            - moderators
          description: Who may start a session in the space
        state:
          type:
            - string
            - 'null'
          maxLength: 64
          description: One of the kind's declared states, or null
        externalRef:
          type:
            - string
            - 'null'
          maxLength: 255
          description: The app's own id for the space; unique within the organization and kind
        metadata:
          $ref: '#/components/schemas/Metadata-2'
        createdBy:
          type: string
          format: uuid
          description: The creator's principal id
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        archivedAt:
          type:
            - string
            - 'null'
          format: date-time
    SpaceWithRole:
      description: A space with the caller's role in it
      allOf:
        - $ref: '#/components/schemas/Space'
        - type: object
          required:
            - role
          properties:
            role:
              oneOf:
                - $ref: '#/components/schemas/SpaceRole'
                - type: 'null'
              description: The caller's role, or null when they read the space without being a member
    SpaceMember:
      type: object
      required:
        - spaceId
        - principalId
        - role
        - joinedAt
      properties:
        spaceId:
          type: string
          format: uuid
        principalId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/SpaceRole'
        joinedAt:
          type: string
          format: date-time
    ListSpacesResponse:
      type: object
      required:
        - data
        - nextCursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SpaceWithRole'
        nextCursor:
          type:
            - string
            - 'null'
          description: Pass it as `cursor` for the next page; null on the last page
    CreateSpaceRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        kind:
          type: string
          minLength: 1
          maxLength: 64
          description: An active kind; `default` when omitted. An unknown or retired kind is `400 kind_not_found`.
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Trimmed
        description:
          type:
            - string
            - 'null'
          maxLength: 10000
        visibility:
          type: string
          enum:
            - public
            - members
          description: Takes the kind's default when omitted; a value is `400 setting_not_overridable` unless the kind lets spaces override `visibility`
        joinPolicy:
          type: string
          enum:
            - open
            - request
            - invite
          description: Takes the kind's default when omitted; a value is `400 setting_not_overridable` unless the kind lets spaces override `join`
        postPolicy:
          type: string
          enum:
            - members
            - moderators
          description: Takes the kind's default when omitted; a value is `400 setting_not_overridable` unless the kind lets spaces override `posting`
        state:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 64
          description: Null or one of the kind's states, else `400 invalid_state`
        externalRef:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 255
          description: Unique per organization and kind, else `409 external_ref_taken`
        metadata:
          $ref: '#/components/schemas/Metadata-2'
      examples:
        - kind: support:case
          name: Case 4821
          externalRef: case-4821
          metadata:
            priority: high
    CreateSpaceResponse:
      type: object
      required:
        - space
      properties:
        space:
          $ref: '#/components/schemas/Space'
    UpdateSpaceRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Every field is optional, but at least one is required. `metadata` replaces the whole object.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Trimmed
        description:
          type:
            - string
            - 'null'
          maxLength: 10000
        visibility:
          type: string
          enum:
            - public
            - members
          description: Needs the kind to let spaces override `visibility`
        joinPolicy:
          type: string
          enum:
            - open
            - request
            - invite
          description: Needs the kind to let spaces override `join`
        postPolicy:
          type: string
          enum:
            - members
            - moderators
          description: Needs the kind to let spaces override `posting`
        state:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 64
        externalRef:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 255
        metadata:
          $ref: '#/components/schemas/Metadata-2'
      examples:
        - name: Case 4821 (resolved)
          state: resolved
    GetSpaceResponse:
      type: object
      required:
        - space
        - role
      properties:
        space:
          $ref: '#/components/schemas/Space'
        role:
          oneOf:
            - $ref: '#/components/schemas/SpaceRole'
            - type: 'null'
          description: The caller's role, or null when they read the space without being a member
    SpaceResponse:
      type: object
      required:
        - space
      properties:
        space:
          $ref: '#/components/schemas/Space'
    SpaceEventData:
      type: object
      description: The payload of `space.created`, `space.updated` and `space.archived`, with the event's id
      required:
        - eventId
        - space
      properties:
        eventId:
          type: string
        space:
          $ref: '#/components/schemas/Space'
    SpaceMemberAddedEventData:
      type: object
      required:
        - eventId
        - spaceId
        - member
      properties:
        eventId:
          type: string
        spaceId:
          type: string
          format: uuid
        member:
          $ref: '#/components/schemas/SpaceMember'
    Metadata:
      type: object
      description: |
        A flat object of the caller's choosing, scoped by the app. At most 50 keys matching
        `^[A-Za-z][A-Za-z0-9_.-]{0,63}$`, at most 16 KiB serialized. `PATCH` replaces it whole.
      additionalProperties: true
      propertyNames:
        pattern: ^[A-Za-z][A-Za-z0-9_.-]{0,63}$
      maxProperties: 50
    Session:
      type: object
      description: A conversation, in a space or on its own (a DM or an ad-hoc group)
      required:
        - id
        - organizationId
        - spaceId
        - type
        - access
        - name
        - state
        - lastSeq
        - lastMessageAt
        - externalRef
        - metadata
        - createdBy
        - createdAt
        - updatedAt
        - archivedAt
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        spaceId:
          type:
            - string
            - 'null'
          format: uuid
          description: The space it belongs to; null for a DM or a group without a space
        type:
          type: string
          enum:
            - direct
            - group
        access:
          type: string
          enum:
            - space
            - members
          description: |
            `space`: whoever can read the space can read the session. `members`: its participants, a
            holder of one of the space's kind grants, and `homileo.chat.admin` (in a space). A session
            without a space is always `members`.
        name:
          type:
            - string
            - 'null'
          maxLength: 255
        state:
          type:
            - string
            - 'null'
          maxLength: 64
          description: One of the kind's `states`
        lastSeq:
          type: integer
          description: The `seq` of the latest message; 0 for none
        lastMessageAt:
          type:
            - string
            - 'null'
          format: date-time
        externalRef:
          type:
            - string
            - 'null'
          maxLength: 255
        metadata:
          $ref: '#/components/schemas/Metadata'
        createdBy:
          type: string
          format: uuid
          description: The principal that created it
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        archivedAt:
          type:
            - string
            - 'null'
          format: date-time
    Participant:
      type: object
      description: A principal's current participation in a session
      required:
        - sessionId
        - principalId
        - role
        - lastReadSeq
        - notify
        - joinedAt
      properties:
        sessionId:
          type: string
          format: uuid
        principalId:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - owner
            - member
        lastReadSeq:
          type: integer
          description: The `seq` of the last message they have read
        notify:
          type: string
          enum:
            - all
            - mentions
            - none
        joinedAt:
          type: string
          format: date-time
    SessionWithParticipant:
      allOf:
        - $ref: '#/components/schemas/Session'
        - type: object
          required:
            - participant
          properties:
            participant:
              description: The caller's own participation; null when they are not a participant
              oneOf:
                - $ref: '#/components/schemas/Participant'
                - type: 'null'
    ListSessionsResponse:
      type: object
      required:
        - data
        - nextCursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SessionWithParticipant'
        nextCursor:
          type:
            - string
            - 'null'
    SessionResponse:
      type: object
      required:
        - session
      properties:
        session:
          $ref: '#/components/schemas/Session'
    GetSessionResponse:
      type: object
      required:
        - session
        - participant
      properties:
        session:
          $ref: '#/components/schemas/Session'
        participant:
          description: The caller's own participation; null when they are not a participant
          oneOf:
            - $ref: '#/components/schemas/Participant'
            - type: 'null'
    CreateSessionRequest:
      type: object
      additionalProperties: false
      properties:
        spaceId:
          type: string
          format: uuid
          description: Create the session in this space; omit it for a group of its own
        name:
          type: string
          minLength: 1
          maxLength: 255
        access:
          type: string
          enum:
            - space
            - members
          description: Defaults to `space`. Ignored without a space, where it is always `members`.
        participantIds:
          type: array
          maxItems: 100
          uniqueItems: true
          description: |
            Principals to add besides the creator. In a space every one must be a member of it; a
            stranger or an unknown id is `400 invalid_request`, naming it at `participantIds.<index>`.
          items:
            type: string
            format: uuid
        state:
          type: string
          minLength: 1
          maxLength: 64
          description: One of the space kind's `states`; `400 invalid_state` otherwise
        externalRef:
          type: string
          minLength: 1
          maxLength: 255
        metadata:
          $ref: '#/components/schemas/Metadata'
      examples:
        - spaceId: 0198c3a4-5b6d-7a10-8f2e-3c4d5e6f7a8b
          name: Order 1042
          externalRef: order-1042
    DirectSessionRequest:
      type: object
      additionalProperties: false
      required:
        - principalId
      properties:
        principalId:
          type: string
          format: uuid
          description: The other principal
      examples:
        - principalId: 0198c3a4-5b6d-7a10-8f2e-3c4d5e6f7a8b
    UpdateSessionRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Only the fields given change; `null` clears `name`, `state` and `externalRef`.
      properties:
        name:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 255
        state:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 64
        externalRef:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 255
        metadata:
          $ref: '#/components/schemas/Metadata'
      examples:
        - name: Order 1042 (shipped)
          state: closed
    SessionEventData:
      type: object
      description: The data of `session.created`, `session.updated` and `session.archived`
      required:
        - session
        - eventId
      properties:
        session:
          $ref: '#/components/schemas/Session'
        eventId:
          type: string
    SessionParticipantAddedEventData:
      type: object
      required:
        - sessionId
        - participant
        - eventId
      properties:
        sessionId:
          type: string
          format: uuid
        participant:
          $ref: '#/components/schemas/Participant'
        eventId:
          type: string
    SpaceMemberWithPrincipal:
      description: A member and the principal behind them
      allOf:
        - $ref: '#/components/schemas/SpaceMember'
        - type: object
          required:
            - principal
          properties:
            principal:
              $ref: '#/components/schemas/Principal'
    ListMembersResponse:
      type: object
      required:
        - data
        - nextCursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SpaceMemberWithPrincipal'
        nextCursor:
          type:
            - string
            - 'null'
          description: Pass it as `cursor` for the next page; null on the last page
    PutMemberRequest:
      type: object
      additionalProperties: false
      required:
        - role
      properties:
        role:
          $ref: '#/components/schemas/SpaceRole'
      examples:
        - role: moderator
    SpaceMemberResponse:
      type: object
      required:
        - member
      properties:
        member:
          $ref: '#/components/schemas/SpaceMember'
    JoinRequestStatus:
      type: string
      enum:
        - pending
        - approved
        - denied
    JoinRequest:
      type: object
      description: A principal's request to join a `request` space
      required:
        - id
        - spaceId
        - principalId
        - status
        - createdAt
        - decidedBy
        - decidedAt
      properties:
        id:
          type: string
          format: uuid
        spaceId:
          type: string
          format: uuid
        principalId:
          type: string
          format: uuid
          description: The applicant
        status:
          $ref: '#/components/schemas/JoinRequestStatus'
        createdAt:
          type: string
          format: date-time
        decidedBy:
          type:
            - string
            - 'null'
          format: uuid
          description: The moderator's principal id
        decidedAt:
          type:
            - string
            - 'null'
          format: date-time
    JoinRequestWithPrincipal:
      description: A join request and the applicant's principal
      allOf:
        - $ref: '#/components/schemas/JoinRequest'
        - type: object
          required:
            - principal
          properties:
            principal:
              $ref: '#/components/schemas/Principal'
    JoinRequestResponse:
      type: object
      required:
        - request
      properties:
        request:
          $ref: '#/components/schemas/JoinRequest'
    ListJoinRequestsResponse:
      type: object
      required:
        - data
        - nextCursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/JoinRequestWithPrincipal'
        nextCursor:
          type:
            - string
            - 'null'
          description: Pass it as `cursor` for the next page; null on the last page
    SpaceMemberRemovedEventData:
      type: object
      required:
        - eventId
        - spaceId
        - principalId
      properties:
        eventId:
          type: string
        spaceId:
          type: string
          format: uuid
        principalId:
          type: string
          format: uuid
    SpaceMemberRoleChangedEventData:
      type: object
      required:
        - eventId
        - spaceId
        - member
        - previousRole
      properties:
        eventId:
          type: string
        spaceId:
          type: string
          format: uuid
        member:
          $ref: '#/components/schemas/SpaceMember'
        previousRole:
          $ref: '#/components/schemas/SpaceRole'
    JoinRequestEventData:
      type: object
      description: The payload of `space.join_requested` and `space.join_decided`, with the event's id
      required:
        - eventId
        - request
      properties:
        eventId:
          type: string
        request:
          $ref: '#/components/schemas/JoinRequest'
    SessionParticipantRemovedEventData:
      type: object
      required:
        - sessionId
        - principalId
        - eventId
      properties:
        sessionId:
          type: string
          format: uuid
        principalId:
          type: string
          format: uuid
        eventId:
          type: string
    ParticipantWithPrincipal:
      allOf:
        - $ref: '#/components/schemas/Participant'
        - type: object
          required:
            - principal
          properties:
            principal:
              $ref: '#/components/schemas/Principal'
    ListParticipantsResponse:
      type: object
      required:
        - data
        - nextCursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ParticipantWithPrincipal'
        nextCursor:
          type:
            - string
            - 'null'
    ParticipantResponse:
      type: object
      required:
        - participant
      properties:
        participant:
          $ref: '#/components/schemas/Participant'
    ReadPositionRequest:
      type: object
      additionalProperties: false
      required:
        - seq
      properties:
        seq:
          type: integer
          minimum: 0
          description: The `seq` of the last message read
      examples:
        - seq: 42
    ReadPositionResponse:
      type: object
      required:
        - lastReadSeq
      properties:
        lastReadSeq:
          type: integer
          description: The position after the request; it never moves back and never passes the session's `lastSeq`
    NotifyRequest:
      type: object
      additionalProperties: false
      required:
        - notify
      properties:
        notify:
          type: string
          enum:
            - all
            - mentions
            - none
      examples:
        - notify: mentions
    Attachment:
      type: object
      required:
        - id
        - filename
        - contentType
        - size
        - position
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        contentType:
          type: string
        size:
          type: integer
          description: Bytes
        position:
          type: integer
          description: Its place among the message's attachments, from 0
    ReactionsResponse:
      type: object
      required:
        - reactions
      properties:
        reactions:
          type: array
          description: The message's reactions after the change
          items:
            $ref: '#/components/schemas/ReactionSummary'
    ReactionEventData:
      type: object
      description: The data of `reaction.added` and `reaction.removed`
      required:
        - sessionId
        - messageId
        - principalId
        - emoji
        - eventId
      properties:
        sessionId:
          type: string
          format: uuid
        messageId:
          type: string
          format: uuid
        principalId:
          type: string
          format: uuid
        emoji:
          type: string
        eventId:
          type: string
    CreateAttachmentRequest:
      type: object
      additionalProperties: false
      required:
        - filename
        - contentType
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[^/\x00-\x1f\x7f]+$
          description: Kept as the attachment's default filename; no slash or control characters
        contentType:
          type: string
          minLength: 1
          maxLength: 255
    CreateAttachmentResponse:
      type: object
      required:
        - objectId
        - uploadUrl
        - expiresAt
      properties:
        objectId:
          type: string
          format: uuid
          description: Names the upload in `attachments` when sending
        uploadUrl:
          type: string
          description: A presigned URL to `PUT` the file's bytes to
        expiresAt:
          type: string
          format: date-time
          description: When `uploadUrl` stops working
    AttachmentResponse:
      type: object
      required:
        - attachment
        - url
        - expiresAt
      properties:
        attachment:
          $ref: '#/components/schemas/Attachment'
        url:
          type: string
          description: A presigned download URL
        expiresAt:
          type: string
          format: date-time
          description: When `url` stops working
    ReactionSummary:
      type: object
      required:
        - emoji
        - count
        - principalIds
      properties:
        emoji:
          type: string
        count:
          type: integer
        principalIds:
          type: array
          maxItems: 50
          description: The first 50 to react, oldest first
          items:
            type: string
            format: uuid
    Message:
      type: object
      description: |
        A message in a session. A reply has `threadRootId`; a deleted message has an empty `body`,
        `deletedAt` set, and no attachments or reactions.
      required:
        - id
        - sessionId
        - seq
        - senderId
        - clientMessageId
        - type
        - body
        - payload
        - metadata
        - threadRootId
        - replyCount
        - lastReplyAt
        - revision
        - createdAt
        - editedAt
        - deletedAt
        - deletedBy
        - attachments
        - reactions
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        seq:
          type: integer
          description: Its place in the session, from 1, gap-free; replies take a `seq` too
        senderId:
          type: string
          format: uuid
        clientMessageId:
          type: string
          maxLength: 128
        type:
          type: string
          description: '`text`, or a message type an app provisioned'
        body:
          type:
            - string
            - 'null'
          description: Markdown (CommonMark with GFM strikethrough, task lists and autolinks), with mentions as `<@principal-id>`, `<!here>` and `<!session>`
        payload:
          description: A provisioned type's data, valid against its schema; `null` for `text`
        metadata:
          $ref: '#/components/schemas/Metadata'
        threadRootId:
          type:
            - string
            - 'null'
          format: uuid
          description: The root message, for a reply
        replyCount:
          type: integer
          description: How many replies the message has, as a thread's root
        lastReplyAt:
          type:
            - string
            - 'null'
          format: date-time
        revision:
          type: integer
          description: 1, plus one per edit
        createdAt:
          type: string
          format: date-time
        editedAt:
          type:
            - string
            - 'null'
          format: date-time
        deletedAt:
          type:
            - string
            - 'null'
          format: date-time
        deletedBy:
          type:
            - string
            - 'null'
          format: uuid
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        reactions:
          type: array
          items:
            $ref: '#/components/schemas/ReactionSummary'
    SendMessageRequest:
      type: object
      additionalProperties: false
      required:
        - clientMessageId
      description: |
        A `text` message (the default type) needs `body` or `attachments` and takes no `payload`. A message of a
        provisioned type needs `payload`; its `body`, if given, is the fallback rendering.
      properties:
        clientMessageId:
          type: string
          minLength: 1
          maxLength: 128
          description: The client's own id for the message; a repeat in the same session from the same sender is `409 duplicate_client_message`
        type:
          type: string
          minLength: 1
          maxLength: 64
          default: text
        body:
          type: string
          minLength: 1
          maxLength: 40000
        payload:
          description: Any JSON value except `null`, at most 64 KiB serialized
        metadata:
          $ref: '#/components/schemas/Metadata'
        threadRootId:
          type: string
          format: uuid
          description: Send as a reply to this top-level, undeleted message of the same session
        attachments:
          type: array
          maxItems: 10
          description: |
            Files uploaded through `POST /v1/sessions/{sessionId}/attachments` by this sender for
            this session, in display order. Each `objectId` must be unique, uploaded (not empty) and
            not on another message, else `400 attachment_not_uploaded` or `400 attachment_not_found`.
          items:
            type: object
            additionalProperties: false
            required:
              - objectId
            properties:
              objectId:
                type: string
                format: uuid
              filename:
                type: string
                minLength: 1
                maxLength: 255
                description: Overrides the filename given at upload
      examples:
        - clientMessageId: 7f1c2a9e-local-1
          body: Shipped today, <@0198c3a4-5b6d-7a10-8f2e-3c4d5e6f7a8b>
        - clientMessageId: 7f1c2a9e-local-2
          type: support:order-card
          payload:
            orderId: '1042'
            status: shipped
          body: Order 1042 shipped
    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          $ref: '#/components/schemas/Message'
    DuplicateClientMessageError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required:
            - message
          properties:
            error:
              const: duplicate_client_message
            message:
              $ref: '#/components/schemas/Message'
    ListMessagesResponse:
      type: object
      required:
        - data
        - hasBefore
        - hasAfter
      properties:
        data:
          type: array
          description: Top-level messages, ascending by `seq`
          items:
            $ref: '#/components/schemas/Message'
        hasBefore:
          type: boolean
          description: Older top-level messages exist
        hasAfter:
          type: boolean
          description: Newer top-level messages exist
    EditMessageRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        At least one field. A `text` message takes no `payload`; the `body` of a `text` message
        cannot be removed.
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 40000
        payload:
          description: Any JSON value except `null`, at most 64 KiB serialized
        metadata:
          $ref: '#/components/schemas/Metadata'
      examples:
        - body: Shipped today (corrected)
    MessageRevision:
      type: object
      required:
        - revision
        - body
        - payload
        - editedBy
        - editedAt
      properties:
        revision:
          type: integer
          description: 1 for the original
        body:
          type:
            - string
            - 'null'
        payload: {}
        editedBy:
          type: string
          format: uuid
          description: The principal who made this revision
        editedAt:
          type: string
          format: date-time
    ListMessageRevisionsResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          description: Oldest first
          items:
            $ref: '#/components/schemas/MessageRevision'
    ThreadFollower:
      type: object
      required:
        - following
        - lastReadSeq
      properties:
        following:
          type: boolean
        lastReadSeq:
          type: integer
          description: The `seq` of the last reply the caller has read
    ThreadResponse:
      type: object
      required:
        - root
        - data
        - hasAfter
        - follower
      properties:
        root:
          $ref: '#/components/schemas/Message'
        data:
          type: array
          description: Replies, ascending by `seq`
          items:
            $ref: '#/components/schemas/Message'
        hasAfter:
          type: boolean
          description: Newer replies exist
        follower:
          description: The caller's row for this thread, or `null` when they have none
          oneOf:
            - $ref: '#/components/schemas/ThreadFollower'
            - type: 'null'
    ThreadReadRequest:
      type: object
      additionalProperties: false
      required:
        - seq
      properties:
        seq:
          type: integer
          minimum: 0
          description: The `seq` of the last reply read
      examples:
        - seq: 42
    ThreadReadResponse:
      type: object
      required:
        - lastReadSeq
      properties:
        lastReadSeq:
          type: integer
          description: The position after the request; it never moves back and never passes the thread's newest reply
    ThreadFollowRequest:
      type: object
      additionalProperties: false
      required:
        - following
      properties:
        following:
          type: boolean
      examples:
        - following: false
    ThreadFollowResponse:
      type: object
      required:
        - following
      properties:
        following:
          type: boolean
    MessageEventData:
      type: object
      description: The data of `message.created`
      required:
        - message
        - eventId
      properties:
        message:
          $ref: '#/components/schemas/Message'
        eventId:
          type: string
    ThreadUpdatedEventData:
      type: object
      required:
        - sessionId
        - rootId
        - replyCount
        - lastReplyAt
        - eventId
      properties:
        sessionId:
          type: string
          format: uuid
        rootId:
          type: string
          format: uuid
        replyCount:
          type: integer
        lastReplyAt:
          type:
            - string
            - 'null'
          format: date-time
        eventId:
          type: string
    WebhookEvent:
      type: object
      description: |
        The envelope of every webhook delivery, as tereo's webhooks service builds and signs it. A
        delivery's headers and signature are tereo's: see its documentation for how to verify one.
      required:
        - id
        - eventType
        - entityType
        - entityId
        - data
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of this payload, per subscribed endpoint
        organizationId:
          type:
            - string
            - 'null'
          format: uuid
          description: The organization the event belongs to
        eventType:
          type: string
          description: The event type, `homileo.<area>.<verb>`
        entityType:
          type: string
          description: The kind of entity the event is about
        entityId:
          type: string
          description: The entity's id
        occurredAt:
          type: string
          format: date-time
        data:
          type: object
          description: The event's payload, with its `eventId` (the id of the event in Homileo's own log)
          required:
            - eventId
          properties:
            eventId:
              type: string
              description: Id of the event row; the same id realtime delivery and `GET /v1/sync` carry
          additionalProperties: true
    EventEnvelope:
      type: object
      description: |
        One event, the same on the socket (where the socket.io event name is its `type`) and from
        `GET /v1/sync`. `payload` is the type's payload as `@homileo-io/sdk`'s `EVENT_TYPES`
        defines it: for a webhook event type, its webhook's `data` without `eventId`.
      required:
        - id
        - type
        - createdAt
        - organizationId
        - spaceId
        - sessionId
        - actorId
        - payload
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: ^\d{1,20}$
          description: The event id, a decimal string. A client drops an id it has already applied.
          examples:
            - '1042'
        type:
          type: string
          enum:
            - space.created
            - space.updated
            - space.archived
            - space.member_added
            - space.member_removed
            - space.member_role_changed
            - space.join_requested
            - space.join_decided
            - session.created
            - session.updated
            - session.archived
            - session.participant_added
            - session.participant_removed
            - message.created
            - message.edited
            - message.deleted
            - reaction.added
            - reaction.removed
            - thread.updated
            - read.updated
            - space.access_revoked
            - session.access_revoked
        createdAt:
          type: string
          format: date-time
        organizationId:
          type: string
          format: uuid
        spaceId:
          type:
            - string
            - 'null'
          format: uuid
        sessionId:
          type:
            - string
            - 'null'
          format: uuid
        actorId:
          type: string
          format: uuid
          description: The principal whose request recorded the event
        payload:
          type: object
          description: The type's payload
    SyncResponse:
      type: object
      required:
        - events
        - next
        - hasMore
      additionalProperties: false
      properties:
        events:
          type: array
          description: The caller's events, in commit order
          items:
            $ref: '#/components/schemas/EventEnvelope'
        next:
          type: string
          description: The cursor to pass as `since` next, also when `events` is empty
        hasMore:
          type: boolean
          description: Whether events remain past `next`; call again with it until this is false
    MePrincipal:
      type: object
      description: The caller's principal
      required:
        - id
        - kind
        - tereoUserId
        - isBot
        - displayName
        - avatarUrl
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - user
            - external
        tereoUserId:
          type:
            - string
            - 'null'
          format: uuid
          description: The tereo user the principal is, for a `user`
        isBot:
          type: boolean
          description: True for a tereo service account
        displayName:
          type:
            - string
            - 'null'
        avatarUrl:
          type:
            - string
            - 'null'
    Metadata-2:
      type: object
      description: |
        A flat object of the caller's choosing: at most 50 keys, each matching
        `^[A-Za-z][A-Za-z0-9_.-]{0,63}$`, at most 16 KiB serialized. An update replaces it whole.
      additionalProperties: true
      examples:
        - team: core
          priority: 2
x-tagGroups:
  - name: Spaces
    tags:
      - Spaces
  - name: Sessions
    tags:
      - Sessions
  - name: Messages
    tags:
      - Messages
  - name: Events
    tags:
      - Events
  - name: Principals
    tags:
      - Principals
  - name: Platform
    tags:
      - Platform
