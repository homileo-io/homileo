# Isolated integration-test stack: throwaway Postgres and Redis on tmpfs, no
# published ports, and the test runner. Driven by docker/test/run.sh, which
# starts one of these per shard of the suite.
name: homileo-test

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: homileo
      POSTGRES_PASSWORD: homileo
      POSTGRES_DB: homileo_test
    tmpfs:
      # postgres:18 keeps PGDATA under this directory.
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homileo -d homileo_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  runner:
    # Tagged, so every shard's stack runs the one image built for the run. The
    # prefix keeps concurrent runs (one per worktree) from retagging each other's.
    image: ${TEST_STACK_PREFIX:-homileo-test}-runner
    build:
      context: ../..
      dockerfile: docker/test/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DOCKER_TEST: "true"
      # This stack's shard of the suite, `<index>/<count>`; unset runs it all.
      TEST_SHARD: ${TEST_SHARD:-}
      # loadTestEnv passes this environment through as-is in Docker, so it
      # carries what a local run takes from .env.
      NODE_ENV: "test"
      LOG_LEVEL: "silent"
      TEREO_TEST_MODE: "true"
      PORT: "4101"
      PUBLIC_URL: http://localhost:4101
      DATABASE_URL: postgresql://homileo:homileo@postgres:5432/homileo_test
      REDIS_URL: redis://redis:6379
